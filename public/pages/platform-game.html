<div class="sub-page-container">
  <div class="page-top-bar">
    <a class="page-back-btn" href="#/games">
      <span class="icon">🎮</span>
      <span>العودة للألعاب</span>
    </a>
  </div>

  <div class="game-wrapper">
    <div id="game-container"></div>
    
    <div class="game-info">
      <div class="score-display">
        <span>النقاط:</span>
        <span id="score-value">0</span>
      </div>
      <div class="level-display">
        <span>المستوى:</span>
        <span id="level-value">1</span>
      </div>
    </div>
  </div>

  <div id="quiz-modal" class="quiz-modal" style="display: none;">
    <div class="quiz-card">
      <div class="quiz-header">
        <h3>🎓 سؤال تعليمي</h3>
        <button class="close-quiz" id="close-quiz-btn">&times;</button>
      </div>
      <div class="quiz-content">
        <p id="quiz-question" class="question-text">جاري تحميل السؤال...</p>
        <div id="quiz-answers" class="answers-grid"></div>
      </div>
      <div class="quiz-footer">
        <button id="skip-quiz-btn" class="btn ghost">تخطي</button>
      </div>
    </div>
  </div>
</div>
