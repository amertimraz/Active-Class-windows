<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>اختيار اسم عشوائي</title>
  <link rel="stylesheet" href="/shared-design.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/pages/names.css">
  <script nonce="ac">
    // Apply saved theme immediately for standalone window, and live-update on changes
    (function(){
      try {
        var theme = localStorage.getItem('cm_theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
        window.addEventListener('storage', function(e){
          if (e.key === 'cm_theme' && e.newValue){
            document.documentElement.setAttribute('data-theme', e.newValue);
          }
        });
      } catch(_){ }
    })();
  </script>
</head>
<body>
  <div class="tool-shell">

    <!-- شريط علوي رفيع: عنوان + تحكم -->
    <div class="tool-header">
      <div class="header-actions">
        <button class="tool-btn close-btn" title="إغلاق">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
        </button>
        <button class="tool-btn fold-btn" title="الإعدادات">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
      <h2 class="tool-title">اختيار اسم عشوائي</h2>
    </div>

    <!-- كتلة العرض: الاسم + العدّادات + الزر، متمركزة كمجموعة واحدة
         في أي مساحة متاحة تحت الهيدر — بدل ما صندوق الاسم نفسه يتمدد -->
    <div class="stage">
      <div class="hero" id="display">
        <div class="placeholder">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.25" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.25" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.25" fill="currentColor" stroke="none"/></svg>
          <p>اختر مجموعة من الإعدادات ثم اضغط اختيار</p>
        </div>
      </div>

      <!-- عدّادات مصغّرة -->
      <div class="stats-bar">
        <span class="stat"><b id="availableCount">0</b> متاح</span>
        <span class="stat"><b id="pickedCount">0</b> مختار</span>
      </div>

      <!-- زر الاختيار -->
      <button id="pickBtn" class="main-pick-btn" disabled>اختيار الآن</button>
    </div>

  </div>

  <script src="/pages/names.js"></script>
</body>
</html>
