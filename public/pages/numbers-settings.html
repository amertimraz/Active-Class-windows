<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إعدادات مولد الأرقام</title>
  <link rel="stylesheet" href="/shared-design.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/pages/numbers-settings.css">
  <script nonce="ac">
    (function(){
      try {
        var theme = localStorage.getItem('cm_theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch(_){ }
    })();
  </script>
</head>
<body>
  <div class="tool-shell">
    <div class="tool-header">
      <button class="tool-btn close-btn" title="إغلاق">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
      </button>
      <h2 class="tool-title">إعدادات الأرقام</h2>
    </div>

    <div class="controls-section">
      <div class="form-row">
        <div class="form-group">
          <label>من</label>
          <input type="number" id="minInput" class="custom-input" value="1" min="1" max="999999">
        </div>
        <div class="form-group">
          <label>إلى</label>
          <input type="number" id="maxInput" class="custom-input" value="10" min="1" max="999999">
        </div>
      </div>
      <div class="form-group">
        <label>عدد الأرقام</label>
        <input type="number" id="countInput" class="custom-input" value="1" min="1" max="50">
      </div>

      <div class="toggle-group">
        <label class="toggle-item">
          <span class="toggle-label">عدم التكرار</span>
          <input type="checkbox" id="noRepeat">
          <span class="toggle-slider"></span>
        </label>
        <label class="toggle-item">
          <span class="toggle-label">صوت</span>
          <input type="checkbox" id="soundToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>
  </div>

  <script src="/pages/numbers-settings.js"></script>
</body>
</html>
