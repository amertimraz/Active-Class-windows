<div class="sub-page-container fade-in">
  <div class="page-top-bar">
    <a class="page-back-btn" href="#/games">
      <span class="icon">🎮</span>
      <span>العودة للألعاب</span>
    </a>
    <div class="header-quick-tools page-qt" id="pageQt_cmp">
      <button class="icon-btn hqt-toggle" id="qtToggle_cmp" aria-haspopup="true" aria-expanded="false">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </button>
      <div class="hqt-menu" id="qtMenu_cmp" hidden>
        <button class="hqt-item" data-qt="timer">⏱ <span>المؤقت الذكي</span></button>
        <button class="hqt-item" data-qt="wheel">✨ <span>عجلة الحظ</span></button>
        <button class="hqt-item" data-qt="numbers">🔢 <span>أرقام عشوائية</span></button>
        <button class="hqt-item" data-qt="names">🎲 <span>اختيار اسم عشوائي</span></button>
      </div>
    </div>
  </div>
  <div class="sub-page-header">
    <h1 class="sub-page-title">المسابقات الطلابية</h1>
    <p class="sub-page-subtitle">نظّم مسابقات بين الطلاب أو الفرق وتابع النتائج فورياً</p>
  </div>

  <div class="sub-page-content">
    <div class="modern-section-card">

      <!-- ══ SETUP SCREEN ══ -->
      <div id="setupScreen" class="cmp-setup">

        <div class="cmp-setup-grid">

          <!-- القسم الأيمن: الإعدادات -->
          <div class="cmp-setup-col">
            <h3 class="cmp-section-title">⚙️ إعدادات المسابقة</h3>

            <div class="cmp-field">
              <label>الاختبار</label>
              <select id="cmpQuizSelect" class="cmp-select">
                <option value="">— جاري التحميل —</option>
              </select>
            </div>

            <div class="cmp-field">
              <label>المجموعة</label>
              <div class="cmp-input-row">
                <select id="cmpGroupSelect" class="cmp-select">
                  <option value="">— كل الطلاب —</option>
                </select>
                <button id="cmpRefreshGroups" class="cmp-btn-icon" title="تحديث">↻</button>
              </div>
              <span id="cmpStudentCount" class="cmp-student-count"></span>
            </div>

            <div class="cmp-field">
              <label>وقت السؤال</label>
              <div class="cmp-time-btns">
                <button class="cmp-time-btn" data-sec="15">15 ث</button>
                <button class="cmp-time-btn active" data-sec="20">20 ث</button>
                <button class="cmp-time-btn" data-sec="30">30 ث</button>
                <button class="cmp-time-btn" data-sec="45">45 ث</button>
                <button class="cmp-time-btn" data-sec="60">60 ث</button>
                <button class="cmp-time-btn" data-sec="120">2 د</button>
              </div>
            </div>

            <div class="cmp-field">
              <label>عدد الأسئلة</label>
              <input type="number" id="cmpQuestionsCount" class="cmp-input" value="10" min="1" max="50">
            </div>

            <div class="cmp-field">
              <label>نوع المسابقة</label>
              <div class="cmp-mode-tabs">
                <button class="cmp-mode-tab active" data-mode="team">👥 فرق</button>
                <button class="cmp-mode-tab" data-mode="pvp">👤 طالب vs طالب</button>
              </div>
            </div>
          </div>

          <!-- القسم الأيسر: الفرق -->
          <div class="cmp-setup-col" id="teamSetupCol">
            <h3 class="cmp-section-title">👥 توزيع الفرق</h3>

            <div class="cmp-field">
              <label>عدد الفرق</label>
              <div class="cmp-teams-count-btns">
                <button class="cmp-count-btn" data-n="2">2</button>
                <button class="cmp-count-btn active" data-n="3">3</button>
                <button class="cmp-count-btn" data-n="4">4</button>
                <button class="cmp-count-btn" data-n="5">5</button>
                <button class="cmp-count-btn" data-n="6">6</button>
              </div>
              <span id="cmpDistHint" class="cmp-student-count"></span>
            </div>

            <button id="cmpDistributeBtn" class="cmp-btn cmp-btn-secondary cmp-btn-block">
              🔀 وزّع الطلاب عشوائياً
            </button>

            <div id="cmpTeamsPreview" class="cmp-teams-preview"></div>
          </div>

          <!-- القسم الأيسر: طالب vs طالب -->
          <div class="cmp-setup-col hidden" id="pvpSetupCol">
            <h3 class="cmp-section-title">👤 اختار المتنافسَين</h3>

            <div class="cmp-field">
              <label>الطالب الأول</label>
              <select id="pvpStudent1" class="cmp-select">
                <option value="">— اختر —</option>
              </select>
            </div>

            <div class="cmp-field">
              <label>الطالب الثاني</label>
              <select id="pvpStudent2" class="cmp-select">
                <option value="">— اختر —</option>
              </select>
            </div>

            <button id="pvpRandomBtn" class="cmp-btn cmp-btn-secondary cmp-btn-block">
              🎲 اختار عشوائي
            </button>
          </div>
        </div>

        <div class="cmp-setup-footer">
          <button id="cmpStartBtn" class="cmp-btn cmp-btn-primary cmp-btn-lg">
            ▶ ابدأ المسابقة
          </button>
        </div>
      </div>

      <!-- ══ PRE-MATCH SCREEN ══ -->
      <div id="prematchScreen" class="cmp-prematch hidden">
        <div class="cmp-prematch-header">
          <div class="cmp-prematch-title">⚔️ الفرق المتنافسة</div>
          <div class="cmp-prematch-subtitle" id="prematchSubtitle">—</div>
        </div>
        <div id="prematchTeams" class="cmp-prematch-teams"></div>
        <div class="cmp-prematch-footer">
          <button id="cmpPrematchStartBtn" class="cmp-prematch-start-btn">
            ▶ ابدأ المسابقة
          </button>
        </div>
      </div>

      <!-- ══ GAME SCREEN ══ -->
      <div id="gameScreen" class="cmp-game hidden">

        <!-- الشريط العلوي -->
        <div class="cmp-game-topbar">
          <div class="cmp-game-controls">
            <button id="cmpPauseBtn" class="cmp-ctrl-btn cmp-ctrl-pause">⏸ إيقاف</button>
            <button id="cmpResumeBtn" class="cmp-ctrl-btn cmp-ctrl-resume hidden">▶ استئناف</button>
            <button id="cmpNextBtn" class="cmp-ctrl-btn cmp-ctrl-skip">تخطى</button>
            <button id="cmpEndBtn" class="cmp-ctrl-btn cmp-ctrl-end">إنهاء</button>
          </div>
          <div id="cmpTurnBadge" class="cmp-turn-badge">
            <span id="cmpTurnName" class="cmp-turn-name">—</span>
            <span class="cmp-turn-label">يجيب الآن</span>
          </div>
          <div class="cmp-topbar-right">
            <div id="cmpProgressDots" class="cmp-progress-dots"></div>
            <span id="cmpQuestionCounter" class="cmp-q-counter">السؤال: 1 / 10</span>
            <button id="cmpFullscreenBtn" class="cmp-ctrl-btn" title="ملء الشاشة">⛶</button>
          </div>
        </div>

        <!-- شريط الوقت -->
        <div class="cmp-timer-track">
          <div id="cmpTimerFill" class="cmp-timer-fill"></div>
          <span id="cmpTimerNum" class="cmp-timer-num">20</span>
        </div>

        <!-- Ready overlay -->
        <div id="cmpReadyOverlay" class="cmp-ready-overlay hidden">
          <div class="cmp-ready-card">
            <span class="cmp-ready-label">الدور على</span>
            <span id="cmpReadyTeam" class="cmp-ready-team">—</span>
            <button id="cmpReadyStartBtn" class="cmp-ready-start-btn">▶ ابدأ السؤال</button>
            <span id="cmpReadyCount" class="cmp-ready-count hidden">3</span>
          </div>
        </div>

        <!-- السؤال والخيارات -->
        <div class="cmp-question-area">
          <p id="cmpQuestionText" class="cmp-question-text">—</p>
          <div id="cmpOptions" class="cmp-options"></div>
        </div>

        <!-- تلميح الدور / زر الاستمرار -->
        <div id="cmpJudgeBar" class="cmp-judge-hint">
          <span id="cmpJudgeHintText">اضغط على إجابة الفريق 👆</span>
          <button id="cmpContinueBtn" class="cmp-continue-btn hidden">
            الفريق التالي ←
          </button>
        </div>

        <!-- الليدربورد -->
        <div id="cmpScoreboard" class="cmp-scoreboard-bar"></div>

      </div>

      <!-- ══ RESULTS SCREEN ══ -->
      <div id="resultsScreen" class="cmp-results hidden">
        <div class="cmp-results-inner">
          <div class="cmp-results-title">🏆 نتائج المسابقة</div>
          <div id="cmpPodium" class="cmp-podium"></div>
          <button id="cmpPlayAgainBtn" class="cmp-btn cmp-btn-primary cmp-btn-lg" style="margin-top:24px">
            ↺ مسابقة جديدة
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Toast -->
  <div id="cmpToast" class="cmp-toast" hidden></div>

  <!-- Celebrate -->
  <div id="cmpCelebrate" class="cmp-celebrate hidden"></div>

  <script src="/pages/competitions.js"></script>
</div>
