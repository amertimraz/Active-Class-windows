<div class="sub-page-container fade-in">
  <div class="sub-page-header">
    <h1 class="sub-page-title">المسابقات الطلابية</h1>
    <p class="sub-page-subtitle">إعداد المسابقات بين الطلاب أو الفرق ومتابعة النتائج</p>
  </div>

  <div class="sub-page-content">
    <div class="modern-section-card">
      <main class="competitions">
        <!-- Setup Panel -->
        <section class="panel setup" aria-label="إعداد المسابقة">
          <h3 class="modern-section-title">إعداد المسابقة</h3>

          <div class="field-row" style="margin-bottom: 1.5rem;">
            <label class="form-label">نوع المسابقة</label>
            <select id="competitionType" class="form-select">
              <option value="pvp">طالب ضد طالب</option>
              <option value="team">فريق ضد فريق</option>
            </select>
          </div>

          <div class="field-row" style="margin-bottom: 1.5rem;">
            <label class="form-label">اختر مجموعة الطلاب</label>
            <div style="display:flex;gap:8px;align-items:center">
              <select id="groupSelect" class="form-select" style="flex:1">
                <option value="">— اختر مجموعة —</option>
              </select>
              <button class="btn btn-outline" id="refreshGroups" title="تحديث المجموعات">تحديث</button>
            </div>
          </div>

          <div class="field-row" id="participantsRow">
            <div class="participants-box" role="group" aria-label="المشاركون" style="background: var(--bg-solid); border-radius:15px; padding:1.5rem; border:1px solid var(--border);">
              <div class="participants-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <h4 style="font-weight:700; margin:0;">المشاركون</h4>
                <div class="participants-actions-row" style="display:flex; gap:8px;">
                   <button class="btn btn-sm btn-outline" id="selectAll">تحديد الكل</button>
                   <button class="btn btn-sm btn-outline" id="clearSelection">مسح</button>
                </div>
              </div>
              <div id="participantsList" class="participants-list" style="max-height:300px; overflow-y:auto; display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:0.5rem;">
                <!-- Participants will be loaded here -->
              </div>
            </div>
          </div>

          <div class="form-actions" style="margin-top:2rem; display:flex; gap:12px;">
            <button class="btn btn-primary" id="startCompetition">ابدأ المسابقة</button>
            <button class="btn btn-secondary" id="resetCompetition">إعادة تعيين</button>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="/pages/competitions.js"></script>
</div>
