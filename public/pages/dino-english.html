<div class="sub-page-container">
  <div class="page-top-bar">
    <a class="page-back-btn" href="#/games">
      <span class="icon">🎮</span>
      <span>العودة للألعاب</span>
    </a>
  </div>
  <div class="game-container">
    <!-- 1. Start Screen -->
    <div id="start-screen" class="screen active">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
        <div class="dino-hero-icon">🦖</div>
        <h1 class="game-title">Dino English</h1>
        <p class="game-subtitle">لعبة شد الحبل التعليمية باللغة الإنجليزية</p>
        <button id="start-btn" class="big-start-btn">ابدأ اللعب</button>
      </div>
    </div>

    <!-- 2. Topics Selection Screen -->
    <div id="topics-screen" class="screen">
      <div class="topics-container">
        <header class="topics-header">
          <h1>🏆 Dino English</h1>
          <p>اختر الموضوع لبدء اللعب</p>
        </header>
        <div class="topics-grid">
          <!-- Generated by JS -->
        </div>
      </div>
    </div>

    <!-- 3. Tug of War Game Screen -->
    <div id="game-play-screen" class="screen">
      <div class="tug-of-war-container">
        <!-- Scoreboard -->
        <div class="scoreboard">
          <div class="team-score team-a">
            <span class="team-name">Dino A</span>
            <div class="question-display" id="question-a">'--'</div>
          </div>
          <div class="vs-divider">
            <span class="vs-text">VS</span>
            <button class="game-restart-btn" id="game-restart-btn">🔄</button>
          </div>
          <div class="team-score team-b">
            <span class="team-name">Dino B</span>
            <div class="question-display" id="question-b">'--'</div>
          </div>
        </div>

        <!-- Tug Area -->
        <div class="tug-area">
          <div class="win-line win-a"></div>
          <div class="rope">
            <div class="rope-marker" id="rope-marker"></div>
          </div>
          <div class="win-line win-b"></div>
          
          <div class="dino-container">
            <div class="dino-character dino-a" id="dino-a"><img src="/assets/1.png" class="dino-img" alt="Dino A"></div>
            <div class="dino-character dino-b" id="dino-b"><img src="/assets/2.png" class="dino-img" alt="Dino B"></div>
          </div>
          
          <div class="team-labels">
            <span class="label-a">Dino A</span>
            <span class="label-b">Dino B</span>
          </div>
        </div>

        <!-- Answers Area -->
        <div class="answers-container">
          <div class="team-answers team-a-answers" id="answers-a">
            <!-- Answers generated by JS -->
          </div>
          <div class="team-answers team-b-answers" id="answers-b">
            <!-- Answers generated by JS -->
          </div>
        </div>
      </div>
    </div>
    <!-- Victory Overlay -->
    <div id="victory-overlay" class="victory-overlay">
      <div class="victory-card">
        <span class="victory-icon">🏆</span>
        <h2 class="victory-title">الفائز هو!</h2>
        <p class="victory-team" id="winner-name">Dino A</p>
        <button id="play-again-btn" class="big-start-btn" style="font-size: 1.5rem; padding: 15px 40px;">العب مرة أخرى</button>
      </div>
    </div>
  </div>
</div>
